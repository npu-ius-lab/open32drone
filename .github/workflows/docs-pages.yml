name: Deploy VitePress to GitHub Pages

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing matching Release tag (required for public deployment)'
        required: false
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Install documentation dependencies
        run: npm ci

      - name: Verify public Release downloads
        if: github.repository == 'npu-ius-lab/open32drone'
        run: node tests/verify_public_release.mjs
        env:
          DOCS_RELEASE_TAG: "${{ inputs.release_tag }}"

      - name: Build VitePress site
        run: npm run docs:check
        env:
          DOCS_BASE: "${{ steps.pages.outputs.base_path }}/"
          DOCS_REPOSITORY: "${{ github.repository }}"
          DOCS_RELEASE_TAG: "${{ inputs.release_tag }}"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/.vitepress/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
