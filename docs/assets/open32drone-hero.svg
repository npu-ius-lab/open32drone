<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Open32Drone Minimal</title>
  <desc id="desc">A full-stack ESP32-S3 micro-UAV platform from carrier board to robotics interface.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071426"/>
      <stop offset="0.55" stop-color="#102a43"/>
      <stop offset="1" stop-color="#0b5961"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2dd4bf"/>
      <stop offset="1" stop-color="#60a5fa"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="360" rx="28" fill="url(#bg)"/>
  <g opacity="0.12" stroke="#a7f3d0" stroke-width="1">
    <path d="M0 70H1200M0 140H1200M0 210H1200M0 280H1200"/>
    <path d="M100 0V360M240 0V360M380 0V360M520 0V360M660 0V360M800 0V360M940 0V360M1080 0V360"/>
  </g>
  <g transform="translate(870 176)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <circle r="112" stroke="#2dd4bf" stroke-opacity="0.18" stroke-width="2"/>
    <circle r="82" stroke="#60a5fa" stroke-opacity="0.22" stroke-width="2" stroke-dasharray="8 10"/>
    <path d="M-42-26L-96-72M42-26L96-72M-42 26L-96 72M42 26L96 72" stroke="url(#accent)" stroke-width="9" filter="url(#glow)"/>
    <ellipse cx="-105" cy="-80" rx="42" ry="13" stroke="#67e8f9" stroke-width="5"/>
    <ellipse cx="105" cy="-80" rx="42" ry="13" stroke="#67e8f9" stroke-width="5"/>
    <ellipse cx="-105" cy="80" rx="42" ry="13" stroke="#67e8f9" stroke-width="5"/>
    <ellipse cx="105" cy="80" rx="42" ry="13" stroke="#67e8f9" stroke-width="5"/>
    <rect x="-48" y="-35" width="96" height="70" rx="18" fill="#0f3348" stroke="#a7f3d0" stroke-width="3"/>
    <circle r="12" fill="#2dd4bf" stroke="none"/>
    <path d="M-28 0H-14M14 0H28" stroke="#93c5fd" stroke-width="5"/>
  </g>
  <g font-family="Inter,Segoe UI,Arial,sans-serif">
    <text x="72" y="122" fill="#f8fafc" font-size="58" font-weight="700" letter-spacing="1">Open32Drone</text>
    <rect x="72" y="145" width="430" height="5" rx="2.5" fill="url(#accent)"/>
    <text x="72" y="205" fill="#cbd5e1" font-size="25">Full-stack micro-UAV on ESP32-S3</text>
    <text x="72" y="246" fill="#94a3b8" font-size="18">MPU9250 · Optical Flow · ToF · SBUS · MAVLink · ROS 2</text>
    <g transform="translate(72 285)" font-size="14" font-weight="600">
      <rect width="180" height="34" rx="17" fill="#123d43" stroke="#2dd4bf"/>
      <text x="90" y="22" text-anchor="middle" fill="#99f6e4">OPEN HARDWARE</text>
      <rect x="196" width="146" height="34" rx="17" fill="#172f4d" stroke="#60a5fa"/>
      <text x="269" y="22" text-anchor="middle" fill="#bfdbfe">ESP32-S3</text>
      <rect x="358" width="180" height="34" rx="17" fill="#2b2949" stroke="#a78bfa"/>
      <text x="448" y="22" text-anchor="middle" fill="#ddd6fe">MINIMAL STACK</text>
    </g>
  </g>
</svg>
