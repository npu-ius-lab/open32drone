<svg xmlns="http://www.w3.org/2000/svg" width="960" height="510" viewBox="0 0 960 510" role="img" aria-labelledby="title desc">
  <title id="title">Open32Drone system overview</title>
  <desc id="desc">SBUS, Android or ROS 2 sends commands to the XIAO ESP32-S3 flight controller. IMU and optical flow/ToF provide measurements; the carrier board drives four motors.</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#64748b"/></marker></defs>
  <style>text{font-family:Arial,'PingFang SC','Microsoft YaHei',sans-serif;fill:#202127}.heading{font-size:20px;font-weight:700}.label{font-size:20px;font-weight:600}.small{font-size:16px;fill:#526174}.wire{fill:none;stroke:#64748b;stroke-width:2;marker-end:url(#arrow)}</style>
  <rect width="960" height="510" rx="18" fill="#ffffff"/>
  <rect x="362" y="64" width="574" height="378" rx="16" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="30" y="40" class="heading">Control options</text>
  <text x="385" y="98" class="heading">Open32Drone · Aircraft</text>
  <g fill="#f6f8fa" stroke="#cbd5e1">
    <rect x="30" y="77" width="245" height="90" rx="12"/>
    <rect x="30" y="197" width="245" height="90" rx="12"/>
    <rect x="30" y="317" width="245" height="90" rx="12"/>
  </g>
  <text x="152" y="113" text-anchor="middle" class="label">RC transmitter</text>
  <text x="152" y="141" text-anchor="middle" class="small">with SBUS receiver</text>
  <text x="152" y="233" text-anchor="middle" class="label">Android app</text>
  <text x="152" y="261" text-anchor="middle" class="small">MAVLink / Wi-Fi</text>
  <text x="152" y="353" text-anchor="middle" class="label">ROS 2 program</text>
  <text x="152" y="381" text-anchor="middle" class="small">MAVLink / Wi-Fi</text>
  <path d="M275 122H319V210H392" class="wire"/>
  <path d="M275 242H392" class="wire"/>
  <path d="M275 362H319V274H392" class="wire"/>
  <rect x="396" y="183" width="244" height="117" rx="14" fill="#f6f8fa" stroke="#2459a6" stroke-width="2"/>
  <text x="518" y="226" text-anchor="middle" class="heading">Flight controller</text>
  <text x="518" y="264" text-anchor="middle" class="small">XIAO ESP32-S3</text>
  <path d="M640 242H729" class="wire"/>
  <text x="689" y="225" text-anchor="middle" class="small">PWM</text>
  <rect x="733" y="183" width="174" height="117" rx="14" fill="#f6f8fa" stroke="#cbd5e1"/>
  <text x="820" y="226" text-anchor="middle" class="label">Motor drive</text>
  <text x="820" y="264" text-anchor="middle" class="small">4 × 8520 motors</text>
  <rect x="396" y="343" width="244" height="77" rx="12" fill="#edf2f7" stroke="#b8c8dc"/>
  <text x="518" y="374" text-anchor="middle" style="font-size:17px;font-weight:600">IMU + optical flow / ToF</text>
  <text x="518" y="401" text-anchor="middle" class="small">Attitude · motion · height</text>
  <path d="M518 343V304" class="wire"/>
  <text x="480" y="480" text-anchor="middle" class="small">Use Android or ROS 2 — one network controller at a time.</text>
</svg>
