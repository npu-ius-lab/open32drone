<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="830" viewBox="0 0 1040 830" role="img" aria-labelledby="title desc">
<title id="title">ROS 2: state feedback and control</title><desc id="desc">The aircraft returns state through MAVROS. The keyboard or a user node sends commands through the driver and MAVROS.</desc>
