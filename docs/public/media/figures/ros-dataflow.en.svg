<path d="M395 665H290" fill="none" stroke="#64748b" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="45" y="380" width="240" height="90" rx="13" fill="#f6f8fa" stroke="#cbd5e1" stroke-width="2"/>
<text x="165" y="433" text-anchor="middle" font-size="21" font-weight="500" fill="#202127">Keyboard / user node</text>
<rect x="400" y="380" width="245" height="150" rx="13" fill="#f6f8fa" stroke="#cbd5e1" stroke-width="2"/>
<text x="522.5" y="433" text-anchor="middle" font-size="20" font-weight="500" fill="#202127">/open32drone/command</text>
<text x="522.5" y="465" text-anchor="middle" font-size="24" font-weight="500" fill="#202127">/cmd_vel</text>
<text x="522.5" y="497" text-anchor="middle" font-size="24" font-weight="500" fill="#202127">/goal_pose</text>
