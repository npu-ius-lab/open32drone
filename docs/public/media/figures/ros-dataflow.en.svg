<style>text{font-family:Arial,'PingFang SC','Microsoft YaHei',sans-serif}</style>
<rect width="1040" height="830" rx="18" fill="#ffffff"/>
<text x="35" y="48" text-anchor="start" font-size="30" font-weight="700" fill="#202127">ROS 2: state feedback and control</text>
<text x="45" y="98" text-anchor="start" font-size="24" font-weight="700" fill="#526174">Read aircraft state</text>
<path d="M285 170H395" fill="none" stroke="#64748b" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M645 170H750" fill="none" stroke="#64748b" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="45" y="125" width="240" height="90" rx="13" fill="#f6f8fa" stroke="#cbd5e1" stroke-width="2"/>
<text x="165" y="178" text-anchor="middle" font-size="24" font-weight="500" fill="#202127">Aircraft</text>
