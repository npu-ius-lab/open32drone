<text x="522.5" y="178" text-anchor="middle" font-size="24" font-weight="500" fill="#202127">MAVROS</text>
<rect x="755" y="125" width="245" height="160" rx="13" fill="#edf2f7" stroke="#cbd5e1" stroke-width="2"/>
<text x="877.5" y="183" text-anchor="middle" font-size="24" font-weight="500" fill="#202127">/open32drone/state</text>
<text x="877.5" y="215" text-anchor="middle" font-size="24" font-weight="500" fill="#202127">/pose · /odom</text>
<text x="877.5" y="247" text-anchor="middle" font-size="24" font-weight="500" fill="#202127">/range/downward</text>
<text x="45" y="352" text-anchor="start" font-size="24" font-weight="700" fill="#526174">Send flight commands</text>
<path d="M285 423H395" fill="none" stroke="#64748b" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M645 423H750" fill="none" stroke="#64748b" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
