<svg xmlns="http://www.w3.org/2000/svg" width="1250" height="730" viewBox="0 0 1250 730" role="img" aria-labelledby="title desc">
<title id="title">自动起飞与降落</title><desc id="desc">空闲、起飞、保持、下降和收油，以及正常切换与中止路径。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#64748b"/></marker></defs>
<style>text{font-family:Arial,'PingFang SC','Microsoft YaHei',sans-serif}</style>
<rect width="1250" height="730" rx="18" fill="#ffffff"/>
<text x="35" y="48" text-anchor="start" font-size="30" font-weight="700" fill="#202127">自动起飞与降落</text>
<path d="M350 195H445" fill="none" stroke="#64748b" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M700 195H795" fill="none" stroke="#64748b" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M925 250V445" fill="none" stroke="#64748b" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M800 505H705" fill="none" stroke="#64748b" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M575 560V640H225V255" fill="none" stroke="#64748b" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M575 250V345H850V445" fill="none" stroke="#64748b" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M1025 450V255" fill="none" stroke="#64748b" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M515 140V100H225V135" fill="none" stroke="#64748b" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="100" y="140" width="250" height="110" rx="13" fill="#eaf2fc" stroke="#2459a6" stroke-width="2"/>
<text x="225" y="203" text-anchor="middle" font-size="24" font-weight="500" fill="#202127">空闲 / 已上锁</text>
<rect x="450" y="140" width="250" height="110" rx="13" fill="#f6f8fa" stroke="#cbd5e1" stroke-width="2"/>
<text x="575" y="203" text-anchor="middle" font-size="24" font-weight="500" fill="#202127">起飞</text>
<rect x="800" y="140" width="250" height="110" rx="13" fill="#f6f8fa" stroke="#cbd5e1" stroke-width="2"/>
<text x="925" y="203" text-anchor="middle" font-size="24" font-weight="500" fill="#202127">保持</text>
<rect x="800" y="450" width="250" height="110" rx="13" fill="#f6f8fa" stroke="#cbd5e1" stroke-width="2"/>
<text x="925" y="513" text-anchor="middle" font-size="24" font-weight="500" fill="#202127">下降</text>
<rect x="450" y="450" width="250" height="110" rx="13" fill="#f6f8fa" stroke="#cbd5e1" stroke-width="2"/>
<text x="575" y="513" text-anchor="middle" font-size="24" font-weight="500" fill="#202127">近地收油</text>
<text x="398" y="153" text-anchor="middle" font-size="20" font-weight="500" paint-order="stroke" stroke="#ffffff" stroke-width="6" stroke-linejoin="round" fill="#202127">起飞请求</text>
<text x="398" y="181" text-anchor="middle" font-size="20" font-weight="500" paint-order="stroke" stroke="#ffffff" stroke-width="6" stroke-linejoin="round" fill="#202127">通过</text>
<text x="750" y="153" text-anchor="middle" font-size="20" font-weight="500" paint-order="stroke" stroke="#ffffff" stroke-width="6" stroke-linejoin="round" fill="#202127">到达目标</text>
<text x="750" y="181" text-anchor="middle" font-size="20" font-weight="500" paint-order="stroke" stroke="#ffffff" stroke-width="6" stroke-linejoin="round" fill="#202127">并稳定</text>
<text x="930" y="326" text-anchor="middle" font-size="20" font-weight="500" paint-order="stroke" stroke="#ffffff" stroke-width="6" stroke-linejoin="round" fill="#202127">降落请求通过</text>
<text x="1130" y="333" text-anchor="middle" font-size="20" font-weight="500" paint-order="stroke" stroke="#ffffff" stroke-width="6" stroke-linejoin="round" fill="#202127">飞手油门</text>
<text x="1130" y="361" text-anchor="middle" font-size="20" font-weight="500" paint-order="stroke" stroke="#ffffff" stroke-width="6" stroke-linejoin="round" fill="#202127">取消下降</text>
<text x="750" y="486" text-anchor="middle" font-size="20" font-weight="500" paint-order="stroke" stroke="#ffffff" stroke-width="6" stroke-linejoin="round" fill="#202127">接近地面</text>
<text x="365" y="85" text-anchor="middle" font-size="20" font-weight="500" paint-order="stroke" stroke="#ffffff" stroke-width="6" stroke-linejoin="round" fill="#202127">近地中止 / 上锁</text>
<text x="595" y="389" text-anchor="middle" font-size="21" font-weight="500" fill="#202127">空中故障 / 飞手中止</text>
<text x="430" y="672" text-anchor="middle" font-size="22" font-weight="500" fill="#526174">确认接地 → 上锁</text>
<circle cx="65" cy="195" r="8" fill="#202127"/>
<path d="M73 195H95" fill="none" stroke="#64748b" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
</svg>
