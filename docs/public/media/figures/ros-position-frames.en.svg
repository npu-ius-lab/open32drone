<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 850" role="img" aria-labelledby="title description">
  <title id="title">The same 0.20 m forward step gives different odometry targets</title>
  <desc id="description">Two horizontal-plane diagrams start at (1.00, -0.40). Facing +X gives target (1.20, -0.40); turning left 90 degrees to +Y gives target (1.00, -0.20).</desc>
  <defs>
    <marker id="axis-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#64748b"/>
    </marker>
    <marker id="move-arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#2459a6"/>
    </marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #202127; }
      .heading { font-size: 26px; font-weight: 700; }
      .subtitle { font-size: 17px; fill: #526174; }
      .panel-title { font-size: 21px; font-weight: 700; }
      .axis-label { font-size: 18px; font-weight: 700; fill: #526174; }
      .point-label { font-size: 18px; font-weight: 600; }
      .note { font-size: 17px; fill: #526174; }
      .axis { stroke: #64748b; stroke-width: 3; marker-end: url(#axis-arrow); }
      .move { stroke: #2459a6; stroke-width: 5; stroke-linecap: round; marker-end: url(#move-arrow); }
      .current { fill: #64748b; stroke: #fff; stroke-width: 3; }
      .goal { fill: #2459a6; stroke: #fff; stroke-width: 3; }
    </style>
  </defs>

  <rect width="680" height="850" rx="18" fill="#ffffff"/>
  <text x="28" y="47" class="heading">The same 0.20 m forward step</text>
  <text x="28" y="75" class="subtitle">Grey axes stay fixed; blue arrows follow the nose. Not to scale.</text>

  <rect x="18" y="99" width="644" height="345" rx="15" fill="#f6f8fa" stroke="#cbd5e1"/>
  <text x="42" y="138" class="panel-title">① Nose along odometry +X (yaw 0°)</text>
  <line x1="92" y1="237" x2="606" y2="237" class="axis"/>
  <line x1="92" y1="394" x2="92" y2="169" class="axis"/>
  <text x="606" y="265" class="axis-label">+X</text>
  <text x="109" y="183" class="axis-label">+Y</text>
  <text x="106" y="258" class="note">Odom origin</text>
  <line x1="280" y1="318" x2="472" y2="318" class="move"/>
  <circle cx="272" cy="318" r="14" class="current"/>
  <circle cx="488" cy="318" r="14" class="goal"/>
  <text x="202" y="363" class="point-label">Now (1.00, −0.40)</text>
  <text x="382" y="293" class="point-label">Goal (1.20, −0.40)</text>
  <text x="42" y="415" class="note">Result: x increases by 0.20 m; y stays unchanged</text>

  <rect x="18" y="458" width="644" height="345" rx="15" fill="#f6f8fa" stroke="#cbd5e1"/>
  <text x="42" y="497" class="panel-title">② Nose turned left 90°, along odometry +Y</text>
  <line x1="92" y1="587" x2="606" y2="587" class="axis"/>
  <line x1="92" y1="758" x2="92" y2="526" class="axis"/>
  <text x="606" y="615" class="axis-label">+X</text>
  <text x="109" y="542" class="axis-label">+Y</text>
  <text x="106" y="608" class="note">Odom origin</text>
  <line x1="282" y1="704" x2="282" y2="647" class="move"/>
  <circle cx="282" cy="715" r="14" class="current"/>
  <circle cx="282" cy="630" r="14" class="goal"/>
  <text x="319" y="633" class="point-label">Goal (1.00, −0.20)</text>
  <text x="319" y="721" class="point-label">Now (1.00, −0.40)</text>
  <text x="42" y="777" class="note">Result: x stays unchanged; y increases by 0.20 m</text>

  <text x="28" y="835" class="subtitle">Targets are absolute. Read fresh odometry before each step.</text>
</svg>
