<svg xmlns="http://www.w3.org/2000/svg" width="960" height="815" viewBox="0 0 960 815" role="img" aria-labelledby="title desc">
<title id="title">Startup sequence</title><desc id="desc">Power, parameters and motor PWM → Allocate optional camera buffers → Start network services → Initialize sensors and RC → Complete startup → Keep still for gyro calibration</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#64748b"/></marker></defs>
<style>text{font-family:Arial,'PingFang SC','Microsoft YaHei',sans-serif}</style>
<rect width="960" height="815" rx="18" fill="#ffffff"/>
<text x="35" y="48" text-anchor="start" font-size="30" font-weight="700" fill="#202127">Startup sequence</text>
<rect x="125" y="95" width="710" height="82" rx="13" fill="#eaf2fc" stroke="#2459a6" stroke-width="2"/>
<text x="480" y="127" text-anchor="middle" font-size="24" font-weight="500" fill="#202127">Power, parameters and motor PWM</text>
<text x="480" y="159" text-anchor="middle" font-size="19" font-weight="500" fill="#526174">Power → parameter storage → LED / LEDC</text>
<text x="80" y="145" text-anchor="middle" font-size="26" font-weight="700" fill="#64748b">01</text>
<path d="M480 177V205" fill="none" stroke="#64748b" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="125" y="210" width="710" height="82" rx="13" fill="#f6f8fa" stroke="#cbd5e1" stroke-width="2"/>
<text x="480" y="242" text-anchor="middle" font-size="24" font-weight="500" fill="#202127">Allocate optional camera buffers</text>
<text x="480" y="274" text-anchor="middle" font-size="19" font-weight="500" fill="#526174">Before Wi-Fi consumes runtime memory</text>
<text x="80" y="260" text-anchor="middle" font-size="26" font-weight="700" fill="#64748b">02</text>
<path d="M480 292V320" fill="none" stroke="#64748b" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="125" y="325" width="710" height="82" rx="13" fill="#f6f8fa" stroke="#cbd5e1" stroke-width="2"/>
<text x="480" y="357" text-anchor="middle" font-size="24" font-weight="500" fill="#202127">Start network services</text>
<text x="480" y="389" text-anchor="middle" font-size="19" font-weight="500" fill="#526174">Wi-Fi / MAVLink / OTA → optional camera stream</text>
<text x="80" y="375" text-anchor="middle" font-size="26" font-weight="700" fill="#64748b">03</text>
<path d="M480 407V435" fill="none" stroke="#64748b" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="125" y="440" width="710" height="82" rx="13" fill="#f6f8fa" stroke="#cbd5e1" stroke-width="2"/>
<text x="480" y="472" text-anchor="middle" font-size="24" font-weight="500" fill="#202127">Initialize sensors and RC</text>
<text x="480" y="504" text-anchor="middle" font-size="19" font-weight="500" fill="#526174">Selected IMU → SBUS → TF-0850</text>
<text x="80" y="490" text-anchor="middle" font-size="26" font-weight="700" fill="#64748b">04</text>
<path d="M480 522V550" fill="none" stroke="#64748b" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="125" y="555" width="710" height="82" rx="13" fill="#f6f8fa" stroke="#cbd5e1" stroke-width="2"/>
<text x="480" y="587" text-anchor="middle" font-size="24" font-weight="500" fill="#202127">Complete startup</text>
<text x="480" y="619" text-anchor="middle" font-size="19" font-weight="500" fill="#526174">OTA boot validation setup, when enabled</text>
<text x="80" y="605" text-anchor="middle" font-size="26" font-weight="700" fill="#64748b">05</text>
<path d="M480 637V665" fill="none" stroke="#64748b" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="125" y="670" width="710" height="82" rx="13" fill="#f6f8fa" stroke="#cbd5e1" stroke-width="2"/>
<text x="480" y="702" text-anchor="middle" font-size="24" font-weight="500" fill="#202127">Keep still for gyro calibration</text>
<text x="480" y="734" text-anchor="middle" font-size="19" font-weight="500" fill="#526174">Pre-arm remains blocked until calibration completes</text>
<text x="80" y="720" text-anchor="middle" font-size="26" font-weight="700" fill="#64748b">06</text>
</svg>
