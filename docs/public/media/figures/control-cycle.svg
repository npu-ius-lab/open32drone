<svg xmlns="http://www.w3.org/2000/svg" width="960" height="1210" viewBox="0 0 960 1210" role="img" aria-labelledby="title desc">
<title id="title">主循环的执行顺序</title><desc id="desc">目标每秒 300 轮：等待下一轮 → 读取 IMU → 读取遥控器和光流测距 → 计算飞机状态 → 计算控制目标 → 更新电机输出 → 处理通信 → 更新电压、指示灯、日志和参数 → 记录本轮完成时间</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#64748b"/></marker></defs>
<style>text{font-family:Arial,'PingFang SC','Microsoft YaHei',sans-serif}</style>
<rect width="960" height="1210" rx="18" fill="#ffffff"/>
<text x="35" y="48" text-anchor="start" font-size="30" font-weight="700" fill="#202127">主循环的执行顺序</text>
<rect x="125" y="95" width="710" height="82" rx="13" fill="#eaf2fc" stroke="#2459a6" stroke-width="2"/>
<text x="480" y="127" text-anchor="middle" font-size="24" font-weight="500" fill="#202127">等待下一轮开始</text>
<text x="480" y="159" text-anchor="middle" font-size="19" font-weight="500" fill="#526174">目标 300 次/秒，约每 3.3 毫秒一轮</text>
<text x="80" y="145" text-anchor="middle" font-size="26" font-weight="700" fill="#64748b">01</text>
<path d="M480 177V205" fill="none" stroke="#64748b" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="125" y="210" width="710" height="82" rx="13" fill="#f6f8fa" stroke="#cbd5e1" stroke-width="2"/>
<text x="480" y="242" text-anchor="middle" font-size="24" font-weight="500" fill="#202127">读取 IMU</text>
<text x="480" y="274" text-anchor="middle" font-size="19" font-weight="500" fill="#526174">加速度与角速度</text>
<text x="80" y="260" text-anchor="middle" font-size="26" font-weight="700" fill="#64748b">02</text>
<path d="M480 292V320" fill="none" stroke="#64748b" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="125" y="325" width="710" height="82" rx="13" fill="#f6f8fa" stroke="#cbd5e1" stroke-width="2"/>
<text x="480" y="357" text-anchor="middle" font-size="24" font-weight="500" fill="#202127">读取遥控器和光流测距</text>
<text x="480" y="389" text-anchor="middle" font-size="19" font-weight="500" fill="#526174">先记录时间，再读取 SBUS、光流和 ToF</text>
<text x="80" y="375" text-anchor="middle" font-size="26" font-weight="700" fill="#64748b">03</text>
<path d="M480 407V435" fill="none" stroke="#64748b" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="125" y="440" width="710" height="82" rx="13" fill="#f6f8fa" stroke="#cbd5e1" stroke-width="2"/>
<text x="480" y="472" text-anchor="middle" font-size="24" font-weight="500" fill="#202127">计算飞机当前状态</text>
<text x="480" y="504" text-anchor="middle" font-size="19" font-weight="500" fill="#526174">姿态 → 高度 → 水平速度</text>
<text x="80" y="490" text-anchor="middle" font-size="26" font-weight="700" fill="#64748b">04</text>
<path d="M480 522V550" fill="none" stroke="#64748b" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="125" y="555" width="710" height="82" rx="13" fill="#f6f8fa" stroke="#cbd5e1" stroke-width="2"/>
<text x="480" y="587" text-anchor="middle" font-size="24" font-weight="500" fill="#202127">计算怎样接近目标</text>
<text x="480" y="619" text-anchor="middle" font-size="19" font-weight="500" fill="#526174">检查状态，计算姿态和推力修正</text>
<text x="80" y="605" text-anchor="middle" font-size="26" font-weight="700" fill="#64748b">05</text>
<path d="M480 637V665" fill="none" stroke="#64748b" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="125" y="670" width="710" height="82" rx="13" fill="#f6f8fa" stroke="#cbd5e1" stroke-width="2"/>
<text x="480" y="702" text-anchor="middle" font-size="24" font-weight="500" fill="#202127">更新四个电机的输出</text>
<text x="480" y="734" text-anchor="middle" font-size="19" font-weight="500" fill="#526174">sendMotors() 更新 PWM 控制信号</text>
<text x="80" y="720" text-anchor="middle" font-size="26" font-weight="700" fill="#64748b">06</text>
<path d="M480 752V780" fill="none" stroke="#64748b" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="125" y="785" width="710" height="82" rx="13" fill="#f6f8fa" stroke="#cbd5e1" stroke-width="2"/>
<text x="480" y="817" text-anchor="middle" font-size="24" font-weight="500" fill="#202127">处理消息与升级后的启动检查</text>
<text x="480" y="849" text-anchor="middle" font-size="19" font-weight="500" fill="#526174">串口每 3 轮 · MAVLink 每 2 轮 · OTA 检查每 6 轮</text>
<text x="80" y="835" text-anchor="middle" font-size="26" font-weight="700" fill="#64748b">07</text>
<path d="M480 867V895" fill="none" stroke="#64748b" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="125" y="900" width="710" height="82" rx="13" fill="#f6f8fa" stroke="#cbd5e1" stroke-width="2"/>
<text x="480" y="932" text-anchor="middle" font-size="24" font-weight="500" fill="#202127">更新电压、指示灯和记录</text>
<text x="480" y="964" text-anchor="middle" font-size="19" font-weight="500" fill="#526174">读取电压 · 更新 LED · 记录日志 · 检查参数保存</text>
<text x="80" y="950" text-anchor="middle" font-size="26" font-weight="700" fill="#64748b">08</text>
<path d="M480 982V1010" fill="none" stroke="#64748b" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="125" y="1015" width="710" height="82" rx="13" fill="#f6f8fa" stroke="#cbd5e1" stroke-width="2"/>
<text x="480" y="1047" text-anchor="middle" font-size="24" font-weight="500" fill="#202127">记录本轮完成时间</text>
<text x="480" y="1079" text-anchor="middle" font-size="19" font-weight="500" fill="#526174">completeControlLoopWatchdog() 供防卡死监测使用</text>
<text x="80" y="1065" text-anchor="middle" font-size="26" font-weight="700" fill="#64748b">09</text>
<text x="480" y="1178" text-anchor="middle" font-size="21" font-weight="500" fill="#526174">继续下一轮；电机有输出时不保存参数。</text>
</svg>
